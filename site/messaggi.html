<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Aguardiente · Messaggi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="assets/style.css?v=202610021847">
</head>
<body data-page="messaggi">
  <header class="site-header">
    <a class="logo" href="index.html">aguardiente</a>
    <nav class="nav nav-icons" aria-label="Principale">
      <a class="nav-icon" href="annunci.html" aria-label="Annunci"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="fillable" d="M3 10.5v3a1.5 1.5 0 0 0 1.5 1.5H7l6.2 4.1a.8.8 0 0 0 1.3-.7V5.6a.8.8 0 0 0-1.3-.7L7 9H4.5A1.5 1.5 0 0 0 3 10.5z"/><path d="M18 9a4 4 0 0 1 0 6M7 15l1.2 4.2a1 1 0 0 0 1 .8H10"/></svg><span class="nav-tip" aria-hidden="true">Annunci</span></a>
      <a class="nav-icon" href="cerca.html" aria-label="Cerca"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle class="fillable" cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span class="nav-tip" aria-hidden="true">Cerca</span></a>
      <a class="nav-icon nav-add" href="pubblica.html" aria-label="Pubblica annuncio"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="fillable" x="3.5" y="3.5" width="17" height="17" rx="5"/><path class="cut" d="M12 8.5v7M8.5 12h7"/></svg><span class="nav-tip" aria-hidden="true">Pubblica</span></a>
      <a class="nav-icon" href="messaggi.html" aria-current="page" aria-label="Messaggi"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="fillable" d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.4 3.3a.6.6 0 0 1-1-.5V17A2.5 2.5 0 0 1 4 14.5z"/></svg><span class="nav-tip" aria-hidden="true">Messaggi</span></a>
    </nav>
    <div class="header-actions">
      <a class="btn btn-primary" href="pubblica.html">Pubblica annuncio</a>
      <a class="avatar-link" href="profilo.html" aria-label="Il mio profilo">OM</a>
    </div>
  </header>

  <main class="chat">
    <section class="chat-list" aria-label="Conversazioni">
      <h1>Messaggi</h1>
      <label class="field" style="padding:0 10px 12px">Cerca<input type="search" placeholder="Nickname o luogo"></label>
      <div id="conv-list" style="display:flex;flex-direction:column;gap:4px"></div>
    </section>

    <section class="thread" aria-label="Conversazione">
      <div class="thread-head">
        <button class="btn btn-ghost btn-icon thread-back" type="button" aria-label="Torna alle conversazioni"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span class="ad-avatar" id="thread-ini" style="width:48px;height:48px;background:var(--grad-deep);color:#fff"></span>
        <span style="flex-grow:1;display:flex;flex-direction:column"><strong id="thread-name" style="font-size:18px"></strong><span class="muted" id="thread-sub"></span></span>
        <a class="btn btn-ghost" id="thread-link" href="#"></a>
      </div>
      <div class="thread-body" id="thread-msgs"></div>
      <form class="composer" id="composer">
        <label class="sr-only" for="msg-input">Scrivi un messaggio</label>
        <input id="msg-input" type="text" placeholder="Scrivi un messaggio" autocomplete="off">
        <button class="btn btn-primary btn-icon" type="submit" aria-label="Invia" style="width:52px;height:52px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg>
        </button>
      </form>
    </section>

    <aside class="chat-aside" aria-label="Sicurezza">
      <h2 style="font-size:20px">Sicurezza</h2>
      <p class="muted">Puoi bloccare o segnalare in qualsiasi momento, senza che l’altra persona lo sappia.</p>
      <button class="btn btn-ghost" type="button">Blocca</button>
      <button class="btn btn-ghost" type="button" style="color:var(--accent)">Segnala</button>
    </aside>
  </main>

  <script src="assets/data.js?v=202610021847"></script>
  <script src="assets/app.js?v=202610021847"></script>
</body>
</html>
