      <a class="nav-icon" href="vetrina.html" aria-label="Vetrina"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect class="fillable" x="3" y="5" width="18" height="14" rx="3"/><path class="cut" d="M10 9.2v5.6l4.6-2.8z"/></svg><span class="nav-tip" aria-hidden="true">Vetrina</span></a>

    <div class="header-actions">
      <a class="avatar-link" href="profilo.html" aria-label="Il mio profilo"><img src="https://images.unsplash.com/photo-1755884684493-16b21f4adf96?w=96&amp;h=96&amp;fit=crop&amp;crop=entropy&amp;auto=format&amp;q=70" alt=""></a>
    </div>
  </header>

  <main class="container room">
    <a href="webcam.html" style="display:inline-block;padding:12px 0">Tutte le dirette</a>
    <div class="room-grid">
      <section class="room-stage" aria-label="Diretta">
        <div class="stage" id="rm-stage">
          <img id="rm-img" alt="">
          <span class="stage-top"><span class="live-badge"><span class="live-dot" aria-hidden="true"></span>LIVE</span><span class="vt-pill" id="rm-viewers"></span></span>
          <span class="stage-note">Anteprima simulata</span>
          <div class="hearts" id="rm-hearts" aria-hidden="true"></div>
        </div>
        <div class="room-head">
          <span class="vt-av" style="width:48px;height:48px"><img id="rm-av" alt=""></span>
          <div style="flex:1;min-width:0"><strong id="rm-nick" style="font-size:18px"></strong> <span class="badge">Creator verificato</span><br><span class="muted" id="rm-title"></span></div>
        </div>
        <div class="goal card">
          <div class="goal-head"><span><span class="cat-label">Obiettivo</span> <strong id="rm-goal-label"></strong></span><span class="muted" id="rm-goal-num"></span></div>
          <div class="progress"><span id="rm-goal-bar"></span></div>
        </div>
        <div class="tips">
          <span class="wallet" id="rm-wallet"></span>
          <div class="tip-btns" id="rm-tips"></div>
          <button class="btn btn-primary" type="button" id="rm-private"></button>
        </div>
      </section>
      <aside class="room-chat card" aria-label="Chat della diretta">
        <h2 style="font-size:20px">Chat</h2>
        <div class="room-msgs" id="rm-msgs" aria-live="polite"></div>
        <form class="room-composer" id="rm-form"><label class="sr-only" for="rm-input">Scrivi in chat</label><input id="rm-input" type="text" placeholder="Scrivi in chat" autocomplete="off" maxlength="140"><button class="btn btn-primary btn-icon" type="submit" aria-label="Invia"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/></svg></button></form>
      </aside>
    </div>
  </main>

  <dialog class="sheet" id="rm-dialog" aria-labelledby="rm-d-title">
    <div class="sheet-body">
      <h2 id="rm-d-title" style="font-size:24px"></h2>
      <p class="muted" id="rm-d-text"></p>
      <div class="sheet-actions" id="rm-d-actions"></div>
    </div>
  </dialog>
  <footer class="site-footer">
    <div class="container">
      <span>Servizio riservato ai maggiorenni. Vietata ogni forma di prostituzione e di contenuto non consensuale.</span>

        <a href="#">Privacy</a>
        <a href="#">Linee guida</a>
        <a class="strong" href="business.html">Aguardiente Business</a>
      </nav>
    </div>
  </footer>

</body>
</html>
